# The opening manga page: two full-frame H3 takes, character and riverbank painted together and never keyed (key: none).
# The overlay shows each through its side of the paper cut. Frame i is scene time i/24.
- name: panel-riku
  image: panel-riku
  seconds: 5
  frames: 120
  audio: riku
  audio_at: 0.0
  key: none
  prompt: >-
    {{STYLE}} The same young man on the same riverbank as in the image, on-model, ONE CONTINUOUS TAKE with no cuts. 0-0.4 s: closed-mouth grin, his weight shifting slightly. 0.4-3.35 s: he says his line with clear cocky mouth movements that follow the voice, chin up, shoulders moving with his breath. 3.35-4.3 s: mouth closed, his grin widens as he listens. 4.3-5 s: he brings both wrapped fists up into a Muay Thai guard. The whole time the evening wind moves his hair, his shirt and the grass in front of him, the river glitters and the clouds drift slowly. He stays in the left part of the frame, feet planted. No new objects, no other people, no text.
