# First frames. Every shot paints the characters and the world in one image. panel-riku and panel-ren are the two halves of the opening manga page.
panel-riku:
  base: false
  refs: [char-riku-v2, loc-river-v1]
  prompt: >-
    {{STYLE}} Film still, one painted image with the character and the world drawn together. The riverbank from image 2 at sunset, the same river, steel railway bridge and glowing clouds behind him. The 18-year-old man from image 1, the same face, spiky black hair, cheek plaster, very fair ivory skin, lean athletic build, navy sleeveless shirt, red shorts and red hand wraps, stands in the grass in the LEFT part of the frame with his head and chest centred at 27% of the frame width, framed from mid-thigh up, in three-quarter view facing to the RIGHT of the frame, his eyes on someone far away to the right. Loose stance, shoulders back, one wrapped fist at his hip, cocky grin with his mouth closed. The low sun is to his right, so warm orange light falls on the right side of his face and body and his left side falls into soft violet shadow, matching the sky behind him. Out-of-focus tall grass blades in the near foreground overlap the bottom of his shorts and his thighs. Background slightly soft with atmospheric haze, the same depth of field as a real lens. The right part of the frame is only riverbank and sky. No other people, no text.
panel-ren:
  base: false
  refs: [char-ren-v2, loc-river-v1]
  prompt: >-
    {{STYLE}} Film still, one painted image with the character and the world drawn together. The riverbank from image 2 at sunset, the same river, steel railway bridge and low sun behind him. The 20-year-old man from image 1, the same face, short neat black hair, very fair ivory skin, clean white gi, black belt and taped knuckles, stands in the grass in the RIGHT part of the frame with his head and chest centred at 73% of the frame width, framed from mid-thigh up, in three-quarter view facing to the LEFT of the frame, his eyes on someone far away to the left. Standing still and relaxed, arms at his sides, calm focused face with his mouth closed. The low sun is behind him, so a warm golden rim lights his hair and shoulders, the white gi falls into soft warm-grey shade with orange bounce light from the ground, matching the sky behind him. Out-of-focus tall grass blades in the near foreground overlap the bottom of his gi jacket and his thighs. Background slightly soft with atmospheric haze, the same depth of field as a real lens. The left part of the frame is only riverbank and sky. No other people, no text.
charge:
  base: false
  refs: [char-riku-v2, loc-river-v1]
  prompt: >-
    {{STYLE}} Film still from a fast tracking shot, one painted image with the character and the world drawn together. The riverbank from image 2 at sunset. The 18-year-old man from image 1 alone, the same face, spiky black hair, cheek plaster, very fair skin, lean athletic build, navy sleeveless shirt, red shorts, red hand wraps, white ankle wraps and bare feet, sprinting from left to right in pure side view, in the centre of the frame, seen from knee height and from the shins up. Mid-stride, leaning hard into the run, rear leg driving off the ground, fists pumping, jaw set, hair and shirt blown back by his own speed. The camera is travelling beside him at his speed, so the near grass in the foreground is smeared into long horizontal motion-blur streaks and the river, bushes and bridge behind him are softly streaked along the direction of travel, while he stays sharp. Warm orange light from the low sun ahead of him on the front of his body. Dirt kicked up behind his rear foot. No other people, no text.
