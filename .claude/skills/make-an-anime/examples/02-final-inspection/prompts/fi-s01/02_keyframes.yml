# First frames. Every shot paints the man, the machine and the world in one image. The robot kneels on both knees with its
# hands open, palms up, on its thighs; a ladder climbs the right knee to the right thigh, and Tetsu sits on the right palm.
# palm comes before tag and cup because they edit it: the hand has to be the same steel in the same light.
wide:
  base: false
  refs: [char-robot-v1, char-tetsu-v1, loc-yard-v1]
  prompt: >-
    {{STYLE}} Hand-drawn anime film still, one painted image with the machine and the world drawn together. Extreme wide shot of the snowy scrapyard from image 3 at dawn, light snow falling. In the centre the enormous robot from image 1 kneels on both knees in three-quarter view, its small domed head bowed steeply forward as if in prayer, chin down on its chest, the lens aimed at the ground, both its hands lying flat and open on its thighs with the palms up and the fingers uncurled. It is rusted, and thick snow lies on its shoulders, the back of its neck, its forearms and its thighs. Its knees are sunk in the snow. Its round lens is dark. It towers 25 metres above the ground and dwarfs the distant scrap heaps. A tiny man, the man from image 2 seen from behind and no bigger than a fingernail in the frame, is halfway up the steel ladder on the robot's right knee. Pale sky low over the grey sea behind it. No other people, no text.
