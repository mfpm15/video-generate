<!doctype html>
<html><head><meta charset="utf-8"><title>webgl lab</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
<script type="module">
// WebGL lab: can headless Chromium on this laptop create WebGL2 + run three.js deterministically? (render(t) = pure function of t)
import * as THREE from 'three';
const W = innerWidth, H = innerHeight;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); document.body.appendChild(r.domElement);
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(45, W / H, .1, 100); cam.position.set(0, 0, 6);
scene.background = new THREE.Color(0x0a0b0f); scene.add(new THREE.AmbientLight(0xffffff, .5)); const dl = new THREE.DirectionalLight(0xffffff, 2); dl.position.set(3, 4, 5); scene.add(dl);
const meshes = []; for (let i = 0; i < 60; i++) { const m = new THREE.Mesh(new THREE.IcosahedronGeometry(.35, 2), new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(i / 60, .6, .55), roughness: .35, metalness: .3 })); m.userData.i = i; scene.add(m); meshes.push(m); }
window.DUR = 4; window.render = t => { meshes.forEach(m => { const i = m.userData.i, a = t * .6 + i * .5; m.position.set(Math.cos(a) * (1 + i * .05), Math.sin(a * 1.3) * 1.6, Math.sin(a) * 1.5 - 1); m.rotation.set(a, a * .7, 0); }); r.render(scene, cam); };
const gl = r.getContext(); const dbg = gl.getExtension('WEBGL_debug_renderer_info');
window.INFO = { webgl2: r.capabilities.isWebGL2, renderer: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : 'n/a', maxTex: gl.getParameter(gl.MAX_TEXTURE_SIZE) };
window.TEXTS = () => []; window.READY = true;
</script></body></html>
